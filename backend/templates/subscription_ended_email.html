<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription ended - Safely</title>
  </head>
  <body style="margin:0;padding:0;background-color:#161616;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#161616;padding:40px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;width:100%;background-color:#ffffff;border-radius:16px;">
            <tr>
              <td style="padding:40px;">
                <h1 style="margin:0 0 12px 0;font-size:20px;font-weight:700;color:#161616;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;">Your Safely subscription has ended</h1>
                <p style="margin:0 0 20px 0;font-size:14px;line-height:1.7;color:#404040;font-family:Inter,Arial,Helvetica,sans-serif;">We weren't able to process your payment after several attempts, so your subscription has been canceled and premium access has ended.</p>
                <p style="margin:0 0 20px 0;font-size:14px;line-height:1.7;color:#404040;font-family:Inter,Arial,Helvetica,sans-serif;">You're welcome to resubscribe any time from your dashboard.</p>
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="background-color:#161616;border-radius:10px;">
                      <a href="{{ dashboard_url }}" style="display:inline-block;padding:14px 32px;font-size:14px;font-weight:700;color:#ffffff;text-decoration:none;font-family:Inter,Arial,Helvetica,sans-serif;">Go to dashboard &rarr;</a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
