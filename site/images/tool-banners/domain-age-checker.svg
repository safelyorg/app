<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="Domain Age Checker">
  <rect width="640" height="320" fill="#fbf7ed"/>
  <g fill="#161616" opacity="0.07">
    <circle cx="20" cy="20" r="3"/><circle cx="60" cy="20" r="3"/><circle cx="100" cy="20" r="3"/><circle cx="140" cy="20" r="3"/><circle cx="180" cy="20" r="3"/><circle cx="220" cy="20" r="3"/><circle cx="260" cy="20" r="3"/><circle cx="300" cy="20" r="3"/><circle cx="340" cy="20" r="3"/><circle cx="380" cy="20" r="3"/><circle cx="420" cy="20" r="3"/><circle cx="460" cy="20" r="3"/><circle cx="500" cy="20" r="3"/><circle cx="540" cy="20" r="3"/><circle cx="580" cy="20" r="3"/><circle cx="620" cy="20" r="3"/>
    <circle cx="20" cy="300" r="3"/><circle cx="60" cy="300" r="3"/><circle cx="100" cy="300" r="3"/><circle cx="140" cy="300" r="3"/><circle cx="180" cy="300" r="3"/><circle cx="220" cy="300" r="3"/><circle cx="260" cy="300" r="3"/><circle cx="300" cy="300" r="3"/><circle cx="340" cy="300" r="3"/><circle cx="380" cy="300" r="3"/><circle cx="420" cy="300" r="3"/><circle cx="460" cy="300" r="3"/><circle cx="500" cy="300" r="3"/><circle cx="540" cy="300" r="3"/><circle cx="580" cy="300" r="3"/><circle cx="620" cy="300" r="3"/>
  </g>

  <!-- browser window -->
  <rect x="48" y="52" width="372" height="224" rx="18" fill="#161616"/>
  <rect x="40" y="44" width="372" height="224" rx="18" fill="#ffffff" stroke="#161616" stroke-width="4"/>
  <path d="M42 92 H410" stroke="#161616" stroke-width="4"/>
  <circle cx="66" cy="68" r="7" fill="#ff8a7a" stroke="#161616" stroke-width="2.5"/>
  <circle cx="88" cy="68" r="7" fill="#ffcb63" stroke="#161616" stroke-width="2.5"/>
  <circle cx="110" cy="68" r="7" fill="#3dd9a8" stroke="#161616" stroke-width="2.5"/>
  <rect x="132" y="56" width="262" height="24" rx="12" fill="#f1ebda" stroke="#161616" stroke-width="2.5"/>
  <text x="148" y="73" font-family="Archivo, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#161616">new-supplier-shop.com</text>

  <!-- result inside the window -->
  <text x="66" y="128" font-family="Archivo, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#5a5a5a" letter-spacing="1">REGISTERED</text>
  <rect x="66" y="140" width="214" height="46" rx="12" fill="#ffd9d2" stroke="#161616" stroke-width="3"/>
  <text x="84" y="171" font-family="Archivo, Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#161616">2 months ago</text>

  <!-- timeline: registered ... today -->
  <path d="M70 232 H388" stroke="#161616" stroke-width="4" stroke-linecap="round"/>
  <path d="M330 232 H388" stroke="#ff6b5a" stroke-width="10" stroke-linecap="round"/>
  <circle cx="330" cy="232" r="10" fill="#ff6b5a" stroke="#161616" stroke-width="3"/>
  <circle cx="388" cy="232" r="10" fill="#ffffff" stroke="#161616" stroke-width="3"/>
  <text x="70" y="258" font-family="Archivo, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#5a5a5a">2015</text>
  <text x="358" y="258" font-family="Archivo, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#5a5a5a">TODAY</text>

  <!-- calendar -->
  <g transform="rotate(6 530 158)">
    <rect x="466" y="88" width="132" height="140" rx="16" fill="#161616"/>
    <rect x="458" y="80" width="132" height="140" rx="16" fill="#ffffff" stroke="#161616" stroke-width="4"/>
    <path d="M460 118 H588" stroke="#161616" stroke-width="4"/>
    <rect x="460" y="82" width="128" height="36" rx="14" fill="#ffcb63"/>
    <path d="M460 118 H588" stroke="#161616" stroke-width="4"/>
    <rect x="484" y="68" width="10" height="26" rx="5" fill="#161616"/>
    <rect x="554" y="68" width="10" height="26" rx="5" fill="#161616"/>
    <text x="524" y="182" text-anchor="middle" font-family="Archivo, Arial, Helvetica, sans-serif" font-size="46" font-weight="900" fill="#161616">?</text>
    <text x="524" y="208" text-anchor="middle" font-family="Archivo, Arial, Helvetica, sans-serif" font-size="13" font-weight="800" fill="#5a5a5a" letter-spacing="1">HOW OLD</text>
  </g>

  <!-- warning sticker -->
  <g transform="rotate(-8 520 258)">
    <rect x="456" y="240" width="136" height="38" rx="19" fill="#161616"/>
    <rect x="450" y="234" width="136" height="38" rx="19" fill="#ff6b5a" stroke="#161616" stroke-width="3"/>
    <text x="518" y="259" text-anchor="middle" font-family="Archivo, Arial, Helvetica, sans-serif" font-size="15" font-weight="900" fill="#ffffff" letter-spacing="1.5">RED FLAG?</text>
  </g>
</svg>
