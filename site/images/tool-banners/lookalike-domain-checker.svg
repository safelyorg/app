<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="Lookalike Domain Checker">
  <rect width="640" height="320" fill="#fbf7ed"/>
  <g fill="#161616" opacity="0.07">
    <circle cx="20" cy="20" r="3"/><circle cx="60" cy="20" r="3"/><circle cx="100" cy="20" r="3"/><circle cx="140" cy="20" r="3"/><circle cx="180" cy="20" r="3"/><circle cx="220" cy="20" r="3"/><circle cx="260" cy="20" r="3"/><circle cx="300" cy="20" r="3"/><circle cx="340" cy="20" r="3"/><circle cx="380" cy="20" r="3"/><circle cx="420" cy="20" r="3"/><circle cx="460" cy="20" r="3"/><circle cx="500" cy="20" r="3"/><circle cx="540" cy="20" r="3"/><circle cx="580" cy="20" r="3"/><circle cx="620" cy="20" r="3"/>
    <circle cx="20" cy="300" r="3"/><circle cx="60" cy="300" r="3"/><circle cx="100" cy="300" r="3"/><circle cx="140" cy="300" r="3"/><circle cx="180" cy="300" r="3"/><circle cx="220" cy="300" r="3"/><circle cx="260" cy="300" r="3"/><circle cx="300" cy="300" r="3"/><circle cx="340" cy="300" r="3"/><circle cx="380" cy="300" r="3"/><circle cx="420" cy="300" r="3"/><circle cx="460" cy="300" r="3"/><circle cx="500" cy="300" r="3"/><circle cx="540" cy="300" r="3"/><circle cx="580" cy="300" r="3"/><circle cx="620" cy="300" r="3"/>
  </g>

  <!-- the real address -->
  <rect x="58" y="62" width="352" height="74" rx="18" fill="#161616"/>
  <rect x="50" y="54" width="352" height="74" rx="18" fill="#7ee0b5" stroke="#161616" stroke-width="4"/>
  <text x="74" y="83" font-family="Archivo, Arial, Helvetica, sans-serif" font-size="13" font-weight="800" fill="#161616" letter-spacing="1.5">REAL</text>
  <text x="74" y="113" font-family="Archivo, Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#161616">globaltrade.com</text>
  <circle cx="368" cy="91" r="17" fill="#ffffff" stroke="#161616" stroke-width="3"/>
  <path d="M360 91.5l5.5 5.5 10-11" fill="none" stroke="#161616" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the fake address -->
  <rect x="58" y="170" width="352" height="74" rx="18" fill="#161616"/>
  <rect x="50" y="162" width="352" height="74" rx="18" fill="#ffd9d2" stroke="#161616" stroke-width="4"/>
  <text x="74" y="191" font-family="Archivo, Arial, Helvetica, sans-serif" font-size="13" font-weight="800" fill="#161616" letter-spacing="1.5">FAKE</text>
  <text x="74" y="221" font-family="Archivo, Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#161616">g<tspan fill="#e0402f">1</tspan>obaltrade.com</text>
  <circle cx="97" cy="211" r="15" fill="none" stroke="#e0402f" stroke-width="3"/>
  <circle cx="368" cy="199" r="17" fill="#ffffff" stroke="#161616" stroke-width="3"/>
  <path d="M361 192l14 14M375 192l-14 14" stroke="#161616" stroke-width="3.5" stroke-linecap="round"/>

  <!-- magnifying glass -->
  <g transform="rotate(-12 520 150)">
    <circle cx="512" cy="140" r="58" fill="#161616"/>
    <circle cx="504" cy="132" r="58" fill="#ffffff" stroke="#161616" stroke-width="5"/>
    <circle cx="504" cy="132" r="42" fill="#ffcb63" stroke="#161616" stroke-width="3"/>
    <text x="504" y="148" text-anchor="middle" font-family="Archivo, Arial, Helvetica, sans-serif" font-size="46" font-weight="900" fill="#161616">1≠l</text>
    <path d="M546 176 L592 222" stroke="#161616" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- warning sticker -->
  <g transform="rotate(-8 520 268)">
    <rect x="452" y="250" width="148" height="38" rx="19" fill="#161616"/>
    <rect x="446" y="244" width="148" height="38" rx="19" fill="#ff6b5a" stroke="#161616" stroke-width="3"/>
    <text x="520" y="269" text-anchor="middle" font-family="Archivo, Arial, Helvetica, sans-serif" font-size="15" font-weight="900" fill="#ffffff" letter-spacing="1.5">LOOKALIKE?</text>
  </g>
</svg>
